#
# Serves the static site behind Traefik and Cloudflare.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik and Cloudflare terminate TLS; keep nginx's own redirects relative.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # /download serves /download/index.html without a redirect.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Astro's hashed build output never changes under the same name.
    location /_astro/ {
        expires 1y;
    }

    location /fonts/ {
        expires 30d;
    }

    error_page 404 /404.html;
}
