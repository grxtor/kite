name: Package for macOS
description: Create a macOS package for Kite

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  apple-codesign-cert:
    description: Certificate for signing macOS builds
    required: false
  apple-codesign-password:
    description: Password for signing macOS builds
    required: false
  apple-codesign-id:
    description: Certificate ID for signing macOS builds
    required: false
  apple-notarize-apple-id:
    description: Apple ID used for notarizing macOS builds
    required: false
  apple-notarize-team-id:
    description: Team ID used for notarizing macOS builds
    required: false
  apple-notarize-password:
    description: Password used for notarizing macOS builds
    required: false
  sparkle-ed25519-key:
    description: Private key for signing Sparkle updates
    required: false
  qt-major:
    description: Major version of Qt used, to keep artifact names distinct
    required: false
    default: "6"

runs:
  using: composite

  steps:
    - name: Fetch codesign certificate
      shell: bash
      run: |
        echo '${{ inputs.apple-codesign-cert }}' | base64 --decode > codesign.p12
        if [ -n '${{ inputs.apple-codesign-id }}' ]; then
          security create-keychain -p '${{ inputs.apple-codesign-password }}' build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p '${{ inputs.apple-codesign-password }}' build.keychain
          security import codesign.p12 -k build.keychain -P '${{ inputs.apple-codesign-password }}' -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '${{ inputs.apple-codesign-password }}' build.keychain
        else
          echo ":warning: Using ad-hoc code signing for macOS, as certificate was not present." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ env.INSTALL_DIR }}

        if [ -n '${{ inputs.apple-codesign-id }}' ]; then
          APPLE_CODESIGN_ID='${{ inputs.apple-codesign-id }}'
          ENTITLEMENTS_FILE='../branding/App.entitlements'
          TIMESTAMP_FLAG='--timestamp'
        else
          APPLE_CODESIGN_ID='-'
          ENTITLEMENTS_FILE='../branding/AdhocSignedApp.entitlements'
          TIMESTAMP_FLAG='--timestamp=none'
        fi

        sign_nested() {
          [ -e "$1" ] || return 0
          echo "Signing $1"
          codesign --sign "$APPLE_CODESIGN_ID" --force --options runtime $TIMESTAMP_FLAG "$1"
        }

        for framework in Kite.app/Contents/Frameworks/*.framework; do
          [ -d "$framework" ] || continue
          for xpc in "$framework"/Versions/*/XPCServices/*.xpc; do
            sign_nested "$xpc"
          done
          for helper in "$framework"/Versions/*/Autoupdate "$framework"/Versions/*/Updater.app; do
            sign_nested "$helper"
          done
        done

        for framework in Kite.app/Contents/Frameworks/*.framework; do
          sign_nested "$framework"
        done

        find Kite.app/Contents -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.mmco' \) -print0 |
          while IFS= read -r -d '' lib; do
            sign_nested "$lib"
          done

        for binary in kite-updater kite-crashreporter; do
          path="Kite.app/Contents/MacOS/$binary"
          if [ ! -f "$path" ]; then
            echo "::notice::$path not present, nothing to sign."
            continue
          fi
          chmod +x "$path"
          sign_nested "$path"
        done

        chmod +x Kite.app/Contents/MacOS/kite
        echo "Signing Kite.app"
        codesign --sign "$APPLE_CODESIGN_ID" --force \
          --entitlements "$ENTITLEMENTS_FILE" --options runtime $TIMESTAMP_FLAG \
          Kite.app

        codesign --verify --deep --strict --verbose=2 Kite.app

    - name: Notarize
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        cd ${{ env.INSTALL_DIR }}

        if [ -n '${{ inputs.apple-notarize-password }}' ]; then
          ditto -c -k --sequesterRsrc --keepParent "Kite.app" ../Kite.zip
          xcrun notarytool submit ../Kite.zip \
            --wait --progress \
            --apple-id '${{ inputs.apple-notarize-apple-id }}' \
            --team-id '${{ inputs.apple-notarize-team-id }}' \
            --password '${{ inputs.apple-notarize-password }}'

          xcrun stapler staple "Kite.app"
        else
          echo ":warning: Skipping notarization as credentials are not present." >> $GITHUB_STEP_SUMMARY
        fi
        ditto -c -k --sequesterRsrc --keepParent "Kite.app" ../Kite.zip

    - name: Create DMG
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        # dmgbuild lays out the window and adds the licence without driving Finder.
        python3 -m venv "$RUNNER_TEMP/dmgbuild"
        "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7 ds_store==1.3.3 mac_alias==2.2.3

        PACKAGE_DIR='${{ github.action_path }}'
        "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" \
            -s "$PACKAGE_DIR/dmg_settings.py" \
            -D app="${{ env.INSTALL_DIR }}/Kite.app" \
            -D background="$PACKAGE_DIR/dmg-background.png" \
            -D icon=branding/io.github.grxtor.Kite.icns \
            -D license=LICENSE \
            "Kite ${{ inputs.version }}" \
            Kite.dmg

    - name: Make Sparkle signature
      shell: bash
      run: |
        if [ '${{ inputs.sparkle-ed25519-key }}' != '' ]; then
          echo '${{ inputs.sparkle-ed25519-key }}' > ed25519-priv.pem
          OPENSSL=$(brew --prefix openssl@3)/bin/openssl
          signature_zip=$("$OPENSSL" pkeyutl -sign -rawin -in ${{ github.workspace }}/Kite.zip -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          signature_dmg=$("$OPENSSL" pkeyutl -sign -rawin -in ${{ github.workspace }}/Kite.dmg -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          rm ed25519-priv.pem
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :memo: Sparkle Signature (ed25519): \`$signature_zip\` (ZIP)
        - :memo: Sparkle Signature (ed25519): \`$signature_dmg\` (DMG)
        EOF
        else
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :warning: Sparkle Signature (ed25519): No private key available (likely a pull request or fork)
        EOF
        fi

    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: Kite-${{ inputs.artifact-name }}-Qt${{ inputs.qt-major }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: Kite.zip

    - name: Upload disk image
      uses: actions/upload-artifact@v7
      with:
        name: Kite-${{ inputs.artifact-name }}-Qt${{ inputs.qt-major }}-${{ inputs.version }}-${{ inputs.build-type }}-Qt${{ inputs.qt-major }}.dmg
        path: Kite.dmg
