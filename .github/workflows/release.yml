name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    # The signing keys are used here: required reviewers or tag rules on this environment guard
    # them (move the two secrets into it to make that binding).
    environment: Release
    permissions:
      contents: write
    # Not ubuntu-slim: the update feeds are made with Python.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "Kite-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/Kite-source Kite-${{ env.VERSION }}
          mv Kite-Linux-Qt6-Portable*/Kite-portable.tar.gz Kite-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Kite-Linux-aarch64-Qt6-Portable*/Kite-portable.tar.gz Kite-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Kite-Linux-Qt6*.AppImage/Kite-*-x86_64.AppImage Kite-Linux-Qt6-x86_64.AppImage
          mv Kite-Linux-Qt6*.AppImage.zsync/Kite-*-x86_64.AppImage.zsync Kite-Linux-Qt6-x86_64.AppImage.zsync
          mv Kite-Linux-Qt6*.AppImage/Kite-*-aarch64.AppImage Kite-Linux-Qt6-aarch64.AppImage
          mv Kite-Linux-Qt6*.AppImage.zsync/Kite-*-aarch64.AppImage.zsync Kite-Linux-Qt6-aarch64.AppImage.zsync
          mv Kite-macOS-Intel-Qt6*/Kite.zip Kite-macOS-Intel-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-Intel-Qt6*/Kite.dmg Kite-macOS-Intel-Qt6-${{ env.VERSION }}.dmg
          mv Kite-macOS-ARM-Qt6*/Kite.zip Kite-macOS-ARM-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-ARM-Qt6*/Kite.dmg Kite-macOS-ARM-Qt6-${{ env.VERSION }}.dmg
          mv Kite-macOS-Intel-Legacy-Qt6*/Kite.zip Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-Intel-Legacy-Qt6*/Kite.dmg Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf Kite-${{ env.VERSION }}.tar.gz Kite-${{ env.VERSION }}

          # NAME rebuilds the published names from the artifact names.
          for d in Kite-Windows-MSVC*; do
            cd "${d}" || continue
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Kite-Windows-MSVC-Qt6"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Kite-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in Kite-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Kite-Windows-MinGW-Qt6-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Kite-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      # The one list of what the release carries: the feeds below sign exactly these files.
      - name: List the release files
        id: files
        run: |
          cat > release-files.txt <<EOF
          Kite-Linux-Qt6-x86_64.AppImage
          Kite-Linux-Qt6-x86_64.AppImage.zsync
          Kite-Linux-Qt6-aarch64.AppImage
          Kite-Linux-Qt6-aarch64.AppImage.zsync
          Kite-Linux-Qt6-Portable-${VERSION}.tar.gz
          Kite-Linux-aarch64-Qt6-Portable-${VERSION}.tar.gz
          Kite-Windows-MinGW-Qt6-w64-${VERSION}.zip
          Kite-Windows-MinGW-Qt6-w64-Portable-${VERSION}.zip
          Kite-Windows-MinGW-Qt6-w64-Setup-${VERSION}.exe
          Kite-Windows-MSVC-Qt6-arm64-${VERSION}.zip
          Kite-Windows-MSVC-Qt6-arm64-Portable-${VERSION}.zip
          Kite-Windows-MSVC-Qt6-arm64-Setup-${VERSION}.exe
          Kite-Windows-MSVC-Qt6-${VERSION}.zip
          Kite-Windows-MSVC-Qt6-Portable-${VERSION}.zip
          Kite-Windows-MSVC-Qt6-Setup-${VERSION}.exe
          Kite-macOS-Intel-Qt6-${VERSION}.zip
          Kite-macOS-Intel-Qt6-${VERSION}.dmg
          Kite-macOS-ARM-Qt6-${VERSION}.zip
          Kite-macOS-ARM-Qt6-${VERSION}.dmg
          Kite-macOS-Intel-Legacy-Qt6-${VERSION}.zip
          Kite-macOS-Intel-Legacy-Qt6-${VERSION}.dmg
          Kite-${VERSION}.tar.gz
          EOF
          {
            echo 'list<<LIST'
            cat release-files.txt
            printf '%s\n' appcast-macOS-ARM-Qt6.xml appcast-macOS-Intel-Qt6.xml \
              appcast-macOS-Intel-Legacy-Qt6.xml kite-update.json kite-update.json.sig
            echo LIST
          } >> "$GITHUB_OUTPUT"

      # Sparkle's appcasts (macOS, EdDSA over each .zip) and kite-update.json with its signature
      # (Windows, Linux), served from releases/latest/download/. The script fails when the tag is not
      # the version in CMakeLists.txt or a key is not the one built into the apps; a release without
      # these feeds would reach nobody's updater.
      - name: Make and sign the update feeds
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          KITE_UPDATE_ED_PRIVATE_KEY: ${{ secrets.KITE_UPDATE_ED_PRIVATE_KEY }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ] || [ -z "$KITE_UPDATE_ED_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY and KITE_UPDATE_ED_PRIVATE_KEY secrets are needed to sign the update feeds."
            exit 1
          fi
          keys="$RUNNER_TEMP/update-keys"
          mkdir -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$keys/sparkle"
          printf '%s' "$KITE_UPDATE_ED_PRIVATE_KEY" > "$keys/update"

          mapfile -t files < release-files.txt
          script="Kite-${VERSION}/packaging/update-feed/kite_update_feed.py"
          python3 -I "$script" make --tag "$VERSION" --cmake-lists "Kite-${VERSION}/CMakeLists.txt" \
            --sparkle-key-file "$keys/sparkle" --update-key-file "$keys/update" \
            --base-url "$BASE_URL" --out . "${files[@]}"
          # What the apps will check, checked here first.
          python3 -I "$script" verify --tag "$VERSION" --cmake-lists "Kite-${VERSION}/CMakeLists.txt" \
            --feeds . "${files[@]}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Kite ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.files.outputs.list }}
