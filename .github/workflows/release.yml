name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "Kite-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/Kite-source Kite-${{ env.VERSION }}
          mv Kite-Linux-Qt6-Portable*/Kite-portable.tar.gz Kite-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Kite-Linux-aarch64-Qt6-Portable*/Kite-portable.tar.gz Kite-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv Kite-Linux-Qt6*.AppImage/Kite-*-x86_64.AppImage Kite-Linux-Qt6-x86_64.AppImage
          mv Kite-Linux-Qt6*.AppImage.zsync/Kite-*-x86_64.AppImage.zsync Kite-Linux-Qt6-x86_64.AppImage.zsync
          mv Kite-Linux-Qt6*.AppImage/Kite-*-aarch64.AppImage Kite-Linux-Qt6-aarch64.AppImage
          mv Kite-Linux-Qt6*.AppImage.zsync/Kite-*-aarch64.AppImage.zsync Kite-Linux-Qt6-aarch64.AppImage.zsync
          mv Kite-macOS-Intel-Qt6*/Kite.zip Kite-macOS-Intel-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-Intel-Qt6*/Kite.dmg Kite-macOS-Intel-Qt6-${{ env.VERSION }}.dmg
          mv Kite-macOS-ARM-Qt6*/Kite.zip Kite-macOS-ARM-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-ARM-Qt6*/Kite.dmg Kite-macOS-ARM-Qt6-${{ env.VERSION }}.dmg
          mv Kite-macOS-Intel-Legacy-Qt6*/Kite.zip Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.zip
          mv Kite-macOS-Intel-Legacy-Qt6*/Kite.dmg Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf Kite-${{ env.VERSION }}.tar.gz Kite-${{ env.VERSION }}

          # The artifacts are named Kite-<artifact-name>-..., so the Qt
          # version is not right after "MSVC"/"MinGW-w64"; NAME below
          # rebuilds the published names.
          for d in Kite-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Kite-Windows-MSVC-Qt6"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Kite-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in Kite-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Kite-Windows-MinGW-Qt6-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Kite-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Kite ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            Kite-Linux-Qt6-x86_64.AppImage
            Kite-Linux-Qt6-x86_64.AppImage.zsync
            Kite-Linux-Qt6-aarch64.AppImage
            Kite-Linux-Qt6-aarch64.AppImage.zsync
            Kite-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            Kite-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            Kite-Windows-MinGW-Qt6-w64-${{ env.VERSION }}.zip
            Kite-Windows-MinGW-Qt6-w64-Portable-${{ env.VERSION }}.zip
            Kite-Windows-MinGW-Qt6-w64-Setup-${{ env.VERSION }}.exe
            Kite-Windows-MSVC-Qt6-arm64-${{ env.VERSION }}.zip
            Kite-Windows-MSVC-Qt6-arm64-Portable-${{ env.VERSION }}.zip
            Kite-Windows-MSVC-Qt6-arm64-Setup-${{ env.VERSION }}.exe
            Kite-Windows-MSVC-Qt6-${{ env.VERSION }}.zip
            Kite-Windows-MSVC-Qt6-Portable-${{ env.VERSION }}.zip
            Kite-Windows-MSVC-Qt6-Setup-${{ env.VERSION }}.exe
            Kite-macOS-Intel-Qt6-${{ env.VERSION }}.zip
            Kite-macOS-Intel-Qt6-${{ env.VERSION }}.dmg
            Kite-macOS-ARM-Qt6-${{ env.VERSION }}.zip
            Kite-macOS-ARM-Qt6-${{ env.VERSION }}.dmg
            Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.zip
            Kite-macOS-Intel-Legacy-Qt6-${{ env.VERSION }}.dmg
            Kite-${{ env.VERSION }}.tar.gz
