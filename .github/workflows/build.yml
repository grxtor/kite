name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run by release.yml on a tag push, or by hand.
on:
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.build-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.11.2
            qt-major: 6
            build-name: Linux x86_64 Qt6

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.11.2
            qt-major: 6
            build-name: Linux aarch64 Qt6

          # Qt comes from MSYS2's packages here, not install-qt-action.
          - os: windows-2025
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86
            qt-major: 6
            build-name: Windows MinGW x86_64 Qt6

          - os: windows-2025-vs2026
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            # TODO: this is the default in setup-dependencies/windows; find out why it is needed here.
            vcvars-arch: amd64
            qt-version: 6.11.2
            qt-major: 6
            build-name: Windows MSVC x86_64 Qt6

          - os: windows-11-vs2026-arm
            artifact-name: Windows-MSVC-arm64
            cmake-preset: windows_msvc
            vcvars-arch: arm64
            qt-version: 6.11.2
            qt-major: 6
            build-name: Windows MSVC aarch64 Qt6

          - os: macos-26-intel
            artifact-name: macOS-Intel
            cmake-preset: macos
            # Qt 6.11 needs macOS 13 or later.
            macosx-deployment-target: 13.0
            qt-version: 6.11.2
            qt-major: 6
            build-name: macOS x86_64 Qt6

          # Legacy build for Intel Macs on macOS 12, which Qt 6.11 dropped.
          - os: macos-26-intel
            artifact-name: macOS-Intel-Legacy
            cmake-preset: macos
            macosx-deployment-target: 12.0
            qt-version: 6.9.3
            qt-major: 6
            build-name: macOS x86_64 Legacy Qt6

          - os: macos-26
            artifact-name: macOS-ARM
            cmake-preset: macos
            # Qt 6.11 needs macOS 13 or later.
            macosx-deployment-target: 13.0
            qt-version: 6.11.2
            qt-major: 6
            build-name: macOS aarch64 Qt6

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt${{ matrix.qt-major }}
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      UPDATE_CHANNEL: stable
      QT_MAJOR: ${{ matrix.qt-major }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}
          qt-major: ${{ matrix.qt-major }}

      ##
      # BUILD
      ##

      - name: Configure project
        env:
          # Empty when the secret isn't there; the build then has no
          # CurseForge search, as before.
          KITE_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" -DKite_QT_VERSION_MAJOR="$QT_MAJOR" -DKite_BUNDLE_OPENSSL_LIBS="${KITE_BUNDLE_OPENSSL_LIBS:-}" -DKite_CURSEFORGE_API_KEY="${KITE_CURSEFORGE_API_KEY:-}"

      # vcpkg builds the dependencies at configure; save them even if the build
      # fails later. An exact hit has nothing new.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && steps.setup-dependencies.outputs.vcpkg-cache-key != '' && steps.setup-dependencies.outputs.vcpkg-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup-dependencies.outputs.vcpkg-cache-dir }}
          key: ${{ steps.setup-dependencies.outputs.vcpkg-cache-key }}

      - name: Run build
        run: |
          # On Windows, vcpkg's post-link DLL copy (z-applocal) of one test can
          # meet a DLL another link still holds in the shared output folder:
          # "The process cannot access the file because it is being used by
          # another process". A second pass relinks only what failed; a real
          # error fails it again.
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE" ||
            cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        env:
          # On Windows runners Qt sends QtTest output to the debugger, hiding
          # FAIL! lines; this puts it back on stderr.
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE" --output-on-failure

      - name: Check plugin independence
        shell: bash
        run: |
          ./launcher/scripts/check-plugin-independence.sh

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
          qt-major: ${{ matrix.qt-major }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-major: ${{ matrix.qt-major }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          windows-codesign-cert: ${{ secrets.WINDOWS_CODESIGN_CERT }}
          windows-codesign-password: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          msystem: ${{ matrix.msystem }}
          qt-major: ${{ matrix.qt-major }}
